<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spiralday 소스 코드</title>
<!-- 앱(Windows 1.0 부터 · Android)의 ‘소스 코드’ 링크와 ⭐ 부탁은 이 주소(https://spiralday.com/source/)로 와요.
     앱에는 GitHub 주소를 넣지 않았어요: 저장소를 옮기거나 비공개로 돌리면 이 파일만 바꾸면 돼요 (앱은 그대로). -->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FCFBF7">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="canonical" href="https://github.com/Grwaywee/spiralday">
<meta http-equiv="refresh" content="0; url=https://github.com/Grwaywee/spiralday">
<style>
  :root { color-scheme: light; --paper: #FCFBF7; --ink: #2B2B2F; --soft: #69656F; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
         font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-size: 18px; line-height: 1.7; padding: 0 16px; }
  p { margin: 0 0 8px; max-width: 36em; }
  .soft { color: var(--soft); font-size: 16px; }
  a { color: inherit; }
</style>
</head>
<body>
  <main>
    <p>Spiralday 의 소스 코드 페이지(GitHub)로 이동하고 있어요.</p>
    <p class="soft">이동하지 않으면 <a href="https://github.com/Grwaywee/spiralday">github.com/Grwaywee/spiralday</a> 를 눌러 주세요.</p>
  </main>
  <script>location.replace('https://github.com/Grwaywee/spiralday');</script>
</body>
</html>
