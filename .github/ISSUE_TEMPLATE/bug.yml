name: 🐞 버그 신고
description: 이상하게 동작하는 부분을 알려주세요
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요?
      placeholder: 예) 주간 페이지에서 할 일을 쓰고 Enter 를 누르면 글자가 사라져요
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 다시 겪으려면 어떻게 하면 되나요?
      placeholder: |
        1. 주간 보기로 가서
        2. 빈 줄을 누르고
        3. ...
  - type: textarea
    id: expected
    attributes:
      label: 원래는 어떻게 되어야 하나요?
  - type: input
    id: version
    attributes:
      label: 버전 / macOS
      description: 메뉴 Spiralday → Spiralday에 관하여 에서 볼 수 있어요
      placeholder: 예) Spiralday 1.0.0 · macOS 26.1
  - type: textarea
    id: shots
    attributes:
      label: 스크린샷 (있으면)
      description: 이미지를 끌어다 놓으면 올라가요
