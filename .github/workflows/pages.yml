# site/ 폴더를 GitHub Pages (spiralday.com) 로 배포한다
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 앱 안 '소식' 파일이 앱의 규칙(Docs/InAppNews.md)대로 모두 읽힐 때만 올린다
      - name: 소식 파일 검사
        run: node Scripts/news-check.mjs site/news/news.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
